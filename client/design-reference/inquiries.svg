<text x="720" y="2220" text-anchor="middle" fill="#f8f6f2" font-family="Georgia,serif" font-size="38">Seeking a more personal note?</text>
<text x="720" y="2260" text-anchor="middle" fill="#bfc1cf" font-family="Arial,sans-serif" font-size="15">Our fragrance specialists and skincare formulators are available for considered, private guidance.</text>
