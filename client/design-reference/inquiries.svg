<text x="120" y="804" fill="#c9a65b" font-family="Arial,sans-serif" font-size="11" letter-spacing="2.8">CURATED INQUIRIES</text>
<text x="120" y="860" fill="#171826" font-family="Georgia,serif" font-size="38">A few things worth knowing.</text>
<text x="120" y="895" fill="#85879a" font-family="Arial,sans-serif" font-size="14">Explore our most requested notes on ingredients, sourcing, private services, and delivery.</text>
