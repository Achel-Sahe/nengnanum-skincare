<text x="154" y="1002" fill="#c9a65b" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">FROM THE APOTHECARY</text>
<text x="154" y="1055" fill="#f8f6f2" font-family="Georgia,serif" font-size="25">The Alchemy</text>
<text x="154" y="1087" fill="#f8f6f2" font-family="Georgia,serif" font-size="25">of Purity</text>
<line x1="154" y1="1118" x2="206" y2="1118" stroke="#c9a65b"/>
<text x="154" y="1155" fill="#bec0cc" font-family="Arial,sans-serif" font-size="13">Every creation is shaped by</text>
<text x="154" y="1178" fill="#bec0cc" font-family="Arial,sans-serif" font-size="13">careful sourcing, considered</text>
<text x="154" y="1201" fill="#bec0cc" font-family="Arial,sans-serif" font-size="13">formulation, and a patient</text>
<text x="154" y="1224" fill="#bec0cc" font-family="Arial,sans-serif" font-size="13">approach to craft.</text>
<line x1="154" y1="1260" x2="386" y2="1260" stroke="#ffffff" opacity=".16"/>
<text x="154" y="1300" fill="#e7d5ac" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3">OUD  ·  ROSE  ·  MYRRH</text>
<!-- FAQ list: open editorial rows, not boxed cards -->
<g font-family="Arial,sans-serif">
<text x="472" y="986" fill="#c9a65b" font-size="10" letter-spacing="1.6">FORMULATIONS &amp; ALCHEMY</text>
<text x="472" y="1024" fill="#171826" font-family="Georgia,serif" font-size="21">What is distinctive about the 24K gold infusion?</text>
<text x="472" y="1060" fill="#777987" font-size="13">Select formulas feature a carefully suspended gold infusion alongside botanical</text><text x="472" y="1081" fill="#777987" font-size="13">and peptide ingredients. Please consult each product label for its full details.</text>
<line x1="472" y1="1110" x2="1320" y2="1110" stroke="#dedbd3"/>
<text x="472" y="1150" fill="#c9a65b" font-size="10" letter-spacing="1.6">HARVEST &amp; ORIGIN</text>
<text x="472" y="1188" fill="#171826" font-family="Georgia,serif" font-size="21">Where are the Damascene roses harvested?</text>
<text x="472" y="1224" fill="#777987" font-size="13">Our rose materials are sourced from high-altitude growing regions and gathered</text><text x="472" y="1245" fill="#777987" font-size="13">with care during the cool early hours to preserve their delicate aromatic profile.</text>
<line x1="472" y1="1274" x2="1320" y2="1274" stroke="#dedbd3"/>
<text x="472" y="1314" fill="#c9a65b" font-size="10" letter-spacing="1.6">BESPOKE CONSULTATIONS</text>
<text x="472" y="1352" fill="#171826" font-family="Georgia,serif" font-size="21">How does a private fragrance consultation work?</text>
<text x="472" y="1388" fill="#777987" font-size="13">A personal session with an atelier specialist helps refine your preferences and</text><text x="472" y="1409" fill="#777987" font-size="13">guide a tailored fragrance direction, with follow-up details shared privately.</text>
<line x1="472" y1="1438" x2="1320" y2="1438" stroke="#dedbd3"/>
<text x="472" y="1478" fill="#c9a65b" font-size="10" letter-spacing="1.6">ETHICS &amp; FORMULATION</text>
<text x="472" y="1516" fill="#171826" font-family="Georgia,serif" font-size="21">Where can I find testing and ingredient information?</text>
<text x="472" y="1552" fill="#777987" font-size="13">Product-specific ingredients and testing details are available through the product</text><text x="472" y="1573" fill="#777987" font-size="13">information and can be confirmed with our client care team before purchase.</text>
<line x1="472" y1="1602" x2="1320" y2="1602" stroke="#dedbd3"/>
<text x="472" y="1642" fill="#c9a65b" font-size="10" letter-spacing="1.6">CLIENT CARE &amp; DELIVERY</text>
<text x="472" y="1680" fill="#171826" font-family="Georgia,serif" font-size="21">What should I know about international delivery?</text>
<text x="472" y="1716" fill="#777987" font-size="13">Delivery options, timing, and any applicable charges are confirmed at checkout.</text><text x="472" y="1737" fill="#777987" font-size="13">For a particular destination, our concierge can help clarify the available service.</text>
<line x1="472" y1="1766" x2="1320" y2="1766" stroke="#dedbd3"/>
<text x="472" y="1806" fill="#c9a65b" font-size="10" letter-spacing="1.6">GIFTING &amp; PERSONALIZATION</text>
<text x="472" y="1844" fill="#171826" font-family="Georgia,serif" font-size="21">Can a fragrance be personalized as a gift?</text>
<text x="472" y="1880" fill="#777987" font-size="13">Selected pieces can be prepared with a considered presentation. Contact the</text><text x="472" y="1901" fill="#777987" font-size="13">atelier to discuss availability, personalization, and gift packaging.</text>
</g>
<text x="472" y="1972" fill="#171826" font-family="Georgia,serif" font-size="15">Still have a question?</text><text x="625" y="1972" fill="#8a7042" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.3">WRITE TO THE CONCIERGE  →</text>
